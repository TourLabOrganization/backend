spring:
  application:
    name: tourlab-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 30m
  refresh-token-expiry: 14d

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

data-server:
  base-url: ${DATA_SERVER_URL}

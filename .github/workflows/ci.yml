name: CI

on:
  pull_request:
    branches: [ develop, main ]

# 같은 PR에 연속으로 push하면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Gradle 설치
        uses: gradle/actions/setup-gradle@v6

      - name: Spotless 포맷 검사
        run: ./gradlew spotlessCheck

      - name: 빌드 및 테스트
        run: ./gradlew build

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/reports/tests/test
          retention-days: 7

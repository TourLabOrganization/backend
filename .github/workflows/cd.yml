name: CD

on:
  push:
    branches: [ develop ]

concurrency:
  group: cd-develop
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  DEPLOY_DIR: app

jobs:
  deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: develop
      url: ${{ vars.SERVICE_URL }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Gradle 설치
        uses: gradle/actions/setup-gradle@v6

      - name: 빌드 및 테스트
        run: ./gradlew clean build

      - name: Buildx 설치
        uses: docker/setup-buildx-action@v4

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:develop
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: 배포 파일 전송
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml,nginx/templates/default.conf.template
          target: ~/${{ env.DEPLOY_DIR }}
          overwrite: true

      - name: EC2 배포 및 헬스체크
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:develop
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,DEPLOY_DIR,REGISTRY_USER,REGISTRY_TOKEN
          script_stop: true
          script: |
            set -e
            export IMAGE

            cd "$HOME/$DEPLOY_DIR"

            if ! docker compose version > /dev/null 2>&1; then
              echo "docker compose 플러그인이 없습니다 (docker-compose-plugin 설치 필요)"
              exit 1
            fi

            if [ ! -f app.env ]; then
              echo "환경변수 파일이 없습니다: $HOME/$DEPLOY_DIR/app.env"
              exit 1
            fi

            DOMAIN="$(grep -E '^DOMAIN=' app.env | cut -d= -f2-)"
            if [ -z "$DOMAIN" ]; then
              echo "app.env에 DOMAIN이 없습니다"
              exit 1
            fi
            export DOMAIN

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            docker compose pull
            docker logout ghcr.io

            docker compose up -d

            for i in $(seq 1 60); do
              if curl -fsS --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/health" > /dev/null 2>&1; then
                echo "헬스체크 통과 (${i}회째)"
                docker image prune -f || true
                exit 0
              fi
              sleep 2
            done

            echo "헬스체크 실패 - 최근 로그 100줄"
            docker compose logs --tail 100 app nginx || true
            exit 1
